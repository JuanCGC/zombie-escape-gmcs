; ------------------------------------
; Zombie Escape | Customization File
; ------------------------------------
; Any changes you make here will be
; automatically loaded at map start

; Note: No error parsing is done for this.
; Make sure you don't mistype anything.

[Account]
; Note: Less than 1 causes bug
MIN ID CHARACTERS = 4
MIN PASS CHARACTERS = 4
ATTEMPTS FOR LOGGING = 5

[XP]
MAX LEVEL = 250
MAX LEVEL RANGE = 9
MAX FAME = 18
WPN CATEGORY B FAME = 2
WPN CATEGORY E FAME = 4
WPN CATEGORY F FAME = 6
RANGE NAMES = Ciudadano, Recluta, Soldado, Cabo, Brigada, Teniente, Coronel, Capitan, Jefe

[Combo]
LEVEL = 1
COLOR = 255 255 255
SAY = Perfecto

[Chat]
; Using the new chat, plugins that uses chat functions will be disabled.
; To enable again, write here each chat function.
UNBLOCK WORDS = thetime, timeleft, nextmap, currentmap, /zamenu, /unstuck, /hclass, /zclass, /fame, /hh

[Admins] (look in users.ini and Access Flags section)
; Flags - flag needed
; Cost  - cost per month
; Money - your money type: euros, dollars...
; Modes - modes that admin can send in one map
; Drop - multiplier exp drop (don't float)
NAMES = [VIP], [DONADOR], [PLATINUM], [MOD], [STAFF] 
FLAGS = 1, 2, 3, 4, 5
COSTS = 30, 60, 90, 120, 150
MONEY = pesos

[Access Flags]
ENABLE/DISABLE MOD = a
ADMIN MENU = a
START MODES = a
RESPAWN PLAYERS = a
EXTRA ITEMS FREE = 12345
CLASSES FREE = 12345
WEAPONS FREE = 12345
ADMIN MODELS = 12345

