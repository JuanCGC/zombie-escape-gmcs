// -----------------------------
// Zombie Apocalypse 4.6 | Config File
// -----------------------------
// Any changes you make here will be
// automatically loaded at map start

// General
// -------
za_delay 20 // Time before any game mode starts in seconds
za_lighting "m" // Map lighting ["a"-darkest // "z"-brightest // "a"-default // "0"-disabled]
za_thunderclap 90 // Thunderclap rate in seconds [0-disabled]
za_triggered_lights 1 // Allow map triggered lights (e.g. light switches)
za_remove_doors 0 // Remove doors from maps [0-none // 1-rotating only // 2-all doors]
za_blockuse_pushables 1 // Block +use on pushables to prevent the speed bug
za_block_suicide 0 // Prevent players from killing themselves
za_random_spawn 1 // Enable random spawning (will use CSDM spawns if present)
za_respawn_on_worldspawn_kill 1 // Respawn players after a worldspawn kill
za_remove_dropped 0 // Time before removing dropped weapons in seconds [0-disabled]
za_remove_money 1 // Remove player's money
za_buy_custom 1 // Enable custom buy menus
za_buyzone_time 0.0 // Time in seconds humans are allowed to use CS buyzones after spawning
za_random_weapons 0 // Whether players should get weapons randomly instead of buying them
za_admin_models_human 0 // Enable admin player models for humans
za_admin_knife_models_human 0 // Enable admin knife models for humans
za_admin_models_zombie 0 // Enable admin player models for zombies
za_admin_knife_models_zombie 0 // Enable admin knife models for zombies
za_human_classes 1 // Enable human classes
za_zombie_classes 1 // Enable zombie classes
za_starting_ammo_packs 5 // Starting amount of ammo packs for new players
za_points_fame_up 10 // Points to receive (zombie and human) when fame up
za_points_chest 1 // Points to receive (zombie or human) when get a chest
za_prevent_consecutive_modes 1 // Prevent the same game mode from being played two rounds in a row
za_keep_health_on_disconnect 1 // Whether the health of the Nemesis/Alien/Survivor/Wesker chosen to keep the round going should be set to that of the leaving player's
za_hud_display 1 // Display player HUD information
za_hud_stats 1 // Display aiming player HUD information
za_hud_marker 1 // Display HUD marker

// Deathmatch
// ----------
za_deathmatch 0 // Deathmatch mode, respawn as: [0-disabled // 1-human // 2-zombie // 3-randomly // 4-balance]
za_spawn_delay 5 // Delay before respawning on deathmatch mode in seconds
za_spawn_protection 5 // Spawn protection time for deathmatch in seconds [0-disabled]
za_respawn_on_suicide 0 // Respawn players if they commited suicide
za_respawn_after_last_human 1 // Respawn players if only the last human is left
za_infection_allow_respawn 1 // Allow respawning on infection rounds
za_nem_ali_allow_respawn 0 // Allow respawning on nemesis/alien rounds
za_surv_wesk_allow_respawn 0 // Allow respawning on survivor/wesker rounds
za_swarm_allow_respawn 0 // Allow respawning on swarm rounds
za_pla_syn_allow_respawn 0 // Allow respawning on plague/synapsis rounds
za_arm_cry_allow_respawn 0 // Allow respawning on armageddon/crysis rounds
za_respawn_zombies 1 // Whether to respawn killed zombies
za_respawn_humans 1 // Whether to respawn killed humans
za_respawn_nem_ali 1 // Whether to respawn killed nemesis/aliens
za_respawn_surv_wesk 1 // Whether to respawn killed survivors/weskers

// Item Extra
// -----------
za_extra_items 1 // Enable extra items
za_extra_weapons 1 // Include weapons
za_extra_nvision 1 // Include night vision
za_extra_antidote 1 // Include antidote
za_extra_antidote_limit 999 // Antidote purchase limit per round
za_extra_madness 1 // Include zombie madness
za_extra_madness_limit 999 // Zombie madness purchase limit per round
za_extra_madness_duration 5.0 // Zombie madness duration
za_extra_infbomb 1 // Include infection bomb
za_extra_infbomb_limit 999 // Infection bomb purchase limit per round

// Flashlight & Nightvision
// ------------------------
za_nvg_give 2 // Give nightvision [0-disabled // 1-enabled // 2-enabled, but no auto turning on]
za_nvg_size 80 // Nightvision size (radius)
za_flash_size 10 // Custom flashlight size (radius)
za_flash_drain 1 // Custom flashlight drain rate [0-unlimited batteries]
za_flash_charge 5 // Custom flashlight charge rate [0-non chargeable batteries]
za_flash_distance 1000 // Custom flashlight max distance
za_flash_show_all 1 // Let players see each other's flashlights

// Knockback
// ---------
za_knockback 1 // Enable weapon knockback (note: pain shock free increases knockback effect)
za_knockback_damage 1 // Use damage on knockback calculation
za_knockback_power 1 // Use weapon power on knockback calculation
za_knockback_zvel 0 // Should knockback affect vertical velocity
za_knockback_ducking 0.25 // Knockback multiplier for crouched zombies [0-knockback disabled when ducking]
za_knockback_distance 500 // Max distance for knockback to take effect
za_knockback_nemesis 0.25 // Nemesis knockback multiplier [0-disable knockback for nemesis]
za_knockback_alien 0.25 // Alien knockback multiplier [0-disable knockback for alien]

// Longjump
// --------
za_leap_zombies 1 // Give leap to Zombies [0-disabled // 1-enabled // 2-only first zombie // 3-only last zombie]
za_leap_zombies_force 300 // Force multiplier
za_leap_zombies_height 100 // Upwards force
za_leap_zombies_cooldown 10.0 // Time between leap uses
za_leap_nemesis 1 // Give leap to Nemesis
za_leap_nemesis_force 500 // Force multiplier
za_leap_nemesis_height 300 // Upwards force
za_leap_nemesis_cooldown 5.0 // Time between leap uses
za_leap_alien 1 // Give leap to Alien
za_leap_alien_force 500 // Force multiplier
za_leap_alien_height 300 // Upwards force
za_leap_alien_cooldown 5.0 // Time between leap uses

// Humans
// ------
za_human_last_extrahp 100 // Last human's extra health reward
za_human_armor_protect 1 // Armor needs to be reduced completely in order to get infected
za_human_unlimited_ammo 1 // Unlimited ammo [0-disabled // 1-BP ammo // 2-clip ammo]
za_human_damage_reward 500 // How much damage humans must deal on zombies to get an ammo pack
za_human_kill_zombie_xp 100 // Experience given to humans for killing a zombie [0-disabled]
za_human_kill_nemesis_xp 200 // Experience given to humans for killing a nemesis [0-disabled]
za_human_kill_alien_xp 200 // Experience given to humans for killing an alien [0-disabled]

// Custom Grenades
// ---------------
za_fire_grenades 1 // Enable napalm grenades (overrides HE)
za_fire_duration 10 // Burning duration in seconds
za_fire_damage 5 // Burning damage (every 0.2 secs)
za_fire_slowdown 0.5 // Burning slowdown multiplier (0.5 = reduces velocity by a half) [0-disabled]
za_frost_grenades 1 // Enable frost grenades (overrides FB)
za_frost_duration 10 // Freeze duration in seconds
za_frost_nemesis 1 // Freeze affects to nemesis [0-No // 1-Yes]
za_frost_alien 1 // Freeze affects to aliens [0-No // 1-Yes]
za_frozen_damage 1 // Can damage to frozen zombies [0-No // 1-Yes]
za_aura_shield_grenades 1 // Enable aura shield grenades (overrides SG)
za_aura_shield_health 100 // Aura shield health
za_aura_shield_damage 5 // When zombie touch an aurashield, it received this damage

// Special Awps
// ---------------
za_thunder_damage_awp 200 // Damage from each thunder
za_special_awps_nem_ali 1 // Special awps affects to nemesis/alien? [0-No // 1-Yes]

// Zombies
// -------
za_zombie_first_hp 2.0 // First zombie HP multiplier (2.0 = double health)
za_zombie_hitzones 0 // Allowed hitzones bitsum (look into fun.inc for body part bits) [0-disabled]
za_zombie_infect_health 100 // How much health a zombie regains with every infection
za_zombie_fov 110 // Field of view [0-dont change]
za_zombie_silent 1 // Enable silent footsteps
za_zombie_painfree 2 // Zombies are pain shock free [0-disabled // 1-enabled // 2-only last zombie // 3-only first zombie]
za_zombie_bleeding 1 // Zombies leave footprints/bloodstains on the floor
za_zombie_particles 1 // Blood particles when a zombie death
za_zombie_infect_xp 100 // Experience given to zombies for infecting/killing a human [0-disabled]
za_zombie_infect_ap 25 // Ammo packs given to zombies for infecting/killing a human [0-disabled]
za_zombie_kill_survivor_xp 200 // Experience given to zombies for killing a survivor [0-disabled]
za_zombie_kill_wesker_xp 200 // Experience given to zombies for killing a wesker [0-disabled]

// Special Effects
// ---------------
za_infection_screenfade 1 // Screen fade for infected player
za_infection_screenshake 1 // Screen shake for infected player
za_infection_sparkle 1 // Light sparkle on infection
za_infection_tracers 1 // Tracers on infection
za_infection_particles 1 // Particles on infection
za_hud_icons 1 // Display small HUD icons on infection, burning, and freeze events

// Happy Hour
// ---------------
za_happyhour 1 // Enable happy hour
za_happyhour_start 22 // Happy hour starts
za_happyhour_end 23 // Happy hour ends
za_happyhour_drop_xp 2.0 // Multiplier experience drop combo on happy hour (2.0 = double xp)
za_happyhour_drop_ap 2.0 // Multiplier ammo packs drop on happy hour (2.0 = double ap)

// Nemesis
// -------
za_nem_enabled 1 // Enable nemesis mode
za_nem_chance 15 // Chance (1 in X)
za_nem_min_players 10 // Minimum players required
za_nem_health 25000 // Health [0 - human count*base health]
za_nem_base_health 0 // Base health [0 - use first zombie's health]
za_nem_speed 350 // Speed
za_nem_gravity 0.5 // Gravity (0.5 = half)
za_nem_damage 250 // Damage per hit
za_nem_glow 1 // Glow effect
za_nem_aura 0 // Halo effect
za_nem_aura_red 255
za_nem_aura_green 0
za_nem_aura_blue 0
za_nem_painfree 0 // Pain shock free

// Alien
// -------
za_ali_enabled 1 // Enable alien mode
za_ali_chance 15 // Chance (1 in X)
za_ali_min_players 10 // Minimum players required
za_ali_health 25000 // Health [0 - human count*base health]
za_ali_base_health 0 // Base health [0 - use first zombie's health]
za_ali_speed 400 // Speed
za_ali_gravity 0.25 // Gravity (0.5 = half)
za_ali_damage 250 // Damage per hit
za_ali_glow 1 // Glow effect
za_ali_aura 0 // Halo effect
za_ali_aura_red 25
za_ali_aura_green 25
za_ali_aura_blue 100
za_ali_painfree 0 // Pain shock free

// Survivor
// -------
za_surv_enabled 1 // Enable survivor mode
za_surv_chance 15 // Chance (1 in X)
za_surv_min_players 10 // Minimum players required
za_surv_health 8000 // Health  [0 - zombie count*base health]
za_surv_base_health 0 // Base health [0 - use human's health]
za_surv_speed 350 // Speed
za_surv_gravity 1.00 // Gravity (0.5 = half)
za_surv_glow 0 // Glow effect
za_surv_aura 0 // Halo effect
za_surv_painfree 1 // Pain shock free
za_surv_ignore_ammo 0 // Whether to earn ammo packs
za_surv_unlimited_ammo 2 // Unlimited ammo for Survivor [0-disabled // 1-BP ammo // 2-clip ammo]

// Wesker
// -------
za_wesk_enabled 1 // Enable wesker mode
za_wesk_chance 15 // Chance (1 in X)
za_wesk_min_players 10 // Minimum players required
za_wesk_health 6000 // Health
za_wesk_base_health 0 // Base health [0 - use human's health]
za_wesk_speed 320 // Speed
za_wesk_gravity 0.5 // Gravity (0.5 = half)
za_wesk_glow 0 // Glow effect
za_wesk_aura 0 // Halo effect
za_wesk_painfree 1 // Pain shock free
za_wesk_ignore_ammo 0 // Whether to earn ammo packs
za_wesk_unlimited_ammo 2 // Unlimited ammo for Wesker [0-disabled // 1-BP ammo // 2-clip ammo]

// Swarm Mode
// ----------
za_swarm_enabled 1 // Enable swarm mode
za_swarm_chance 10 // Chance (1 in X)
za_swarm_min_players 0 // Minimum players required

// Multiple Infection
// ------------------
za_multi_enabled 1 // Enable multiple infection mode
za_multi_chance 10 // Chance (1 in X)
za_multi_min_players 0 // Minimum players required
za_multi_ratio 0.15 // Infect ratio (zombie count = ratio*humans count)

// Plague Mode
// -----------
za_plague_enabled 1 // Enable plague mode
za_plague_chance 15 // Chance (1 in X)
za_plague_min_players 10 // Minimum players required
za_plague_ratio 0.5 // Infect ratio (zombie count = ratio*humans count)
za_plague_nem_number 1 // Nemesis count
za_plague_nem_hp 24000 // Nemesis health
za_plague_surv_number 1 // Survivor count
za_plague_surv_hp 6500 // Survivor health

// Synapsis Mode
// ------------------
za_synapsis_enabled 1 // Enable synapsis mode
za_synapsis_chance 15 // Chance (1 in X)
za_synapsis_min_players 10 // Minimum players required
za_synapsis_ratio 0.5 // Infect ratio (zombie count = ratio*humans count)
za_synapsis_nem_number 1 // Nemesis count
za_synapsis_nem_hp 24000 // Nemesis health
za_synapsis_surv_number 1 // Survivor count
za_synapsis_surv_hp 6500 // Survivor health

// Armageddon Mode
// ------------------
za_armageddon_enabled 1 // Enable armageddon mode
za_armageddon_chance 20 // Chance (1 in X)
za_armageddon_min_players 10 // Minimum players required
za_armageddon_ratio 0.5 // Infect ratio (zombie count = ratio*humans count)
za_armageddon_nem_hp 24000 // Nemesis health
za_armageddon_surv_hp 6500 // Survivor health

// Crysis Mode
// ------------------
za_crysis_enabled 1 // Enable crysis mode
za_crysis_chance 20 // Chance (1 in X)
za_crysis_min_players 10 // Minimum players required
za_crysis_ratio 0.5 // Infect ratio (zombie count = ratio*humans count)
za_crysis_ali_hp 25000 // Alien health
za_crysis_wesk_hp 4500 // Wesker health

// Logging
// -------
za_logcommands 1 // Log admin commands to "zombieapocalypse.log"

// Additional settings
// -------------------
mp_flashlight 1 // Enables flashlight
mp_footsteps 1 // Enables footsteps
mp_playerid 1 // Prevents seeing enemies in the dark exploit
sv_maxspeed 9999 // Prevents CS from limiting your human/zombie speeds at 320
mp_freezetime 0 // Prevents you are stop x seconds at start round