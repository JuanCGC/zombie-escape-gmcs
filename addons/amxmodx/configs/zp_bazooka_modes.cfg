// ============================================================================
//  zp_bazooka_modes.cfg
//  Config de sintonizacion del Bazooka (plugin ze_extra_bazooka.amxx)
//
//  Este archivo lo ejecuta el plugin al iniciar cada mapa. Si no existe,
//  el plugin usa exactamente estos mismos valores por defecto.
//  Editá los numeros de la derecha para cambiar el comportamiento.
// ============================================================================

// --- Cooldown / disparo ------------------------------------------------------
za_bazooka_delay			"10"		// Segundos de recarga entre disparos
za_bazooka_damage			"500"		// Daño maximo del impacto directo
za_bazooka_radius			"250"		// Radio de la explosion (unidades)

// --- Modos -------------------------------------------------------------------
za_bazooka_map				"0"			// 1 = el bazooka se da siempre como arma de mapa
za_bazooka_awardpacks		"1"			// 1 = da "packs" (recompensa) al acertar

// --- Velocidades -------------------------------------------------------------
za_bazooka_speed			"800"		// Velocidad del cohete normal
za_bazooka_homing_speed		"350"		// Velocidad en modo teledirigido (homing)
za_bazooka_camera_speed		"300"		// Velocidad en modo camara
