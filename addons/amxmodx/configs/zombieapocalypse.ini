; ------------------------------------
; Zombie Apocalypse FVault 4.4 | Customization File
; ------------------------------------
; Any changes you make here will be
; automatically loaded at map start

; Note: No error parsing is done for this.
; Make sure you don't mistype anything.

[Account]
; Note: Less than 1 causes bug
MIN ID CHARACTERS = 4
MIN PASS CHARACTERS = 4
ATTEMPTS FOR LOGGING = 5

[XP]
MAX LEVEL = 250
MAX LEVEL RANGE = 17
MAX FAME = 30
WPN CATEGORY B FAME = 1
WPN CATEGORY E FAME = 1
RANGE NAMES = Explorador, Recluta, Cabo, Cabo Mayor, Sargento, Capitan, Teniente, Coronel, Comandante, General , Asesino , Criminal , Experto , Espia , Super Experto , Killer , Master , Asesino Experto

[Combo]
LEVEL = 0
COLOR = 255 255 255
SAY = Bien

[Chat]
; Using the new chat, plugins that uses chat functions will be disabled.
; To enable again, write here each chat function.
UNBLOCK WORDS = thetime, timeleft, nextmap, currentmap, /zamenu, /unstuck, /hclass, /zclass, /fame, /hh

[Admins] (look in users.ini and Access Flags section)
; Flags - flag needed
; Cost  - cost per month
; Money - your money type: euros, dollars...
; Modes - modes that admin can send in one map
; Drop - multiplier exp drop (don't float)
NAMES = Platinum
FLAGS = p
COSTS = 15
MONEY = pesos
MODES = 99
DROP = 2

[Access Flags]
ENABLE/DISABLE MOD = l
ADMIN MENU = d
START MODES = d
RESPAWN PLAYERS = d
EXTRA ITEMS FREE = n
CLASSES FREE = n
WEAPONS FREE = o
ADMIN MODELS = p

[Player Models] (randomly chosen if more than one)
NEMESIS = za_nemesis
ALIEN = avh_alien
SURVIVOR = marcus
WESKER = wesker
ADMIN ZOMBIE = zombie_source
ADMIN HUMAN = vip

; If you don't want people using altered player models, enable the following.
; 1 = Bounds Check (model's geometry must fit in the same bbox)
; 2 = CRC Check (file on client must exactly match server's file)
FORCE CONSISTENCY = 1

; By default, humans and zombie models are class specific. You can edit them separately in your za_humanclass.ini and za_zombieclasses.ini
; If, however, you want all humans or zombies to use the same models regardless of class, you can enable this
; setting and add your global human models to the "HUMAN" line or global zombie models to the "ZOMBIE" line.
SAME MODELS HUMANS = 0
SAME MODELS ZOMBIES = 0
HUMAN = za_human1
ZOMBIE = zombie_source

